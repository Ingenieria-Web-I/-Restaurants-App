<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurants App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="index.html">🍽️ Restaurants Directory</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li><div class="nav-separator mx-2"></div></li>
            <li class="nav-item">
              <a class="nav-link" href="buscar.html">Search</a>
            </li>
            <li><div class="nav-separator mx-2"></div></li>
            <li class="nav-item">
              <a class="nav-link" href="nuevo.html">New</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4">
      <h2 class="text-center mb-4">Agregar Nuevo Restaurante</h2>
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form onsubmit="guardarRestaurante(event)">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea id="descripcion" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" id="direccion" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">URL de la Imagen</label>
              <input type="url" id="imagen" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar Restaurante</button>
          </form>
        </div>
      </div>
    </div>
    
    <script src="js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
